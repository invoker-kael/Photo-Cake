name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Normal pushes queue behind the active validation run. A deliberately marked
  # recovery commit can cancel a stuck run without restoring always-cancel behavior.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[ci-recover]') }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Check Windows and Android UI
        run: pnpm check

  windows-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --workspace -- --nocapture

      - name: Setup Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Check Android companion Rust contract
        shell: pwsh
        run: |
          $ndkBin = Join-Path $env:ANDROID_NDK_ROOT "toolchains\llvm\prebuilt\windows-x86_64\bin"
          $clang = Join-Path $ndkBin "aarch64-linux-android31-clang.cmd"
          $ar = Join-Path $ndkBin "llvm-ar.exe"
          if (!(Test-Path $clang)) { throw "Android NDK clang not found: $clang" }
          if (!(Test-Path $ar)) { throw "Android NDK llvm-ar not found: $ar" }
          $env:CC_aarch64_linux_android = $clang
          $env:AR_aarch64_linux_android = $ar
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $clang
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_AR = $ar
          cargo check --manifest-path apps/android/src-tauri/Cargo.toml --target aarch64-linux-android --lib

      - name: Fetch and verify pinned Windows models
        run: node scripts/fetch-models.mjs windows

      - name: Run bundled local-model smoke test
        env:
          PHOTO_CAKE_MODEL_DIR: ${{ github.workspace }}\models\runtime\windows
        run: cargo test -p photo-inference bundled_models_smoke -- --ignored --nocapture
