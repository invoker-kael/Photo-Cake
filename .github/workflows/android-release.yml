name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Fetch pinned local models
        run: node scripts/fetch-models.mjs android

      - name: Initialize generated Android project
        working-directory: apps/android
        run: pnpm tauri android init

      - name: Build Android APK with bundled models
        run: pnpm --filter @photo-cake/android tauri android build --apk --config src-tauri/tauri.release.conf.json

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-cake-android
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
