[package]
name = "photo-cake-android"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
name = "photo_cake_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = "2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
photo-core = { path = "../../../crates/photo-core" }

uuid = { version = "1", features = ["v4", "serde"] }
