[workspace]
members = [
  "crates/photo-core",
  "crates/photo-inference",
  "apps/windows/src-tauri"
]
exclude = ["apps/android/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
litert = { package = "google-ai-edge-litert", version = "=0.1.5" }
