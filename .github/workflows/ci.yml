name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Check Windows and Android UI
        run: pnpm check


  windows-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust tests
        run: cargo test --workspace

      - name: Check Android companion Rust contract
        run: cargo check --manifest-path apps/android/src-tauri/Cargo.toml

      - name: Fetch and verify pinned Windows models
        run: node scripts/fetch-models.mjs windows

      - name: Run bundled local-model smoke test
        env:
          PHOTO_CAKE_MODEL_DIR: ${{ github.workspace }}\models\runtime\windows
        run: cargo test -p photo-inference bundled_models_smoke -- --ignored --nocapture
